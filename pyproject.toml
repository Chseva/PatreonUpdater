[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patreon-mega-audit"
version = "1.0"
description = "Audit MEGA folder links referenced by Patreon posts."
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
browser = ["playwright>=1.50"]

[project.scripts]
patreon-mega-audit = "patreon_mega_audit.cli:main"
patreon-mega-update = "patreon_mega_audit.update_posts:main"
patreon-updater = "patreon_mega_audit.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["patreon_mega_audit*"]
